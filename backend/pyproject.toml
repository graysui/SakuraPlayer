[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sakuraplayer"
version = "0.1.0"
description = "Private SakuraPlayer backend"
requires-python = "==3.10.16"
license = { text = "GPL-3.0-only" }
dependencies = [
  "alembic==1.16.2",
  "APScheduler==3.10.4",
  "argon2-cffi==23.1.0",
  "cryptography==45.0.4",
  "fastapi==0.110.1",
  "httpx==0.28.1",
  "Pillow==11.2.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.7.4",
  "pydantic-settings==2.2.1",
  "PyJWT==2.10.1",
  "SQLAlchemy==2.0.41",
  "starlette==0.37.2",
  "uvicorn==0.22.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sakuraplayer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "host_docker: requires the host Docker CLI",
  "integration: requires the isolated PostgreSQL test container",
]

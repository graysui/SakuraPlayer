name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      archive_name: ${{ steps.version.outputs.archive_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to Flutter version
        id: version
        run: python tools/release/validate_version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  quality:
    name: Run release quality gates
    needs: validate
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  windows:
    name: Build Windows release
    needs: [validate, quality]
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.29.2
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: windows
        run: flutter pub get
      - name: Build and verify private ZIP
        shell: pwsh
        run: windows/tool/build_private_release.ps1 -OutputDirectory windows/dist
      - name: Verify release asset names
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
        run: |
          $archive = Join-Path 'windows/dist' $env:ARCHIVE_NAME
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "Missing $archive" }
          if (-not (Test-Path -LiteralPath "$archive.sha256" -PathType Leaf)) { throw "Missing $archive.sha256" }
      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            windows/dist/${{ needs.validate.outputs.archive_name }}
            windows/dist/${{ needs.validate.outputs.archive_name }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attest Windows release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            windows/dist/${{ needs.validate.outputs.archive_name }}
            windows/dist/${{ needs.validate.outputs.archive_name }}.sha256

  docker:
    name: Publish backend image
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: graysui
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/graysui/sakuraplayer-backend
            docker.io/graysui/sakuraplayer-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha
      - name: Build and push backend runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/docker/api.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR backend image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/graysui/sakuraplayer-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest Docker Hub backend image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: docker.io/graysui/sakuraplayer-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create GitHub Release
    needs: [validate, quality, windows, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.semver }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/$ARCHIVE_NAME" \
            "release-assets/$ARCHIVE_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SakuraPlayer $RELEASE_VERSION" \
            --generate-notes

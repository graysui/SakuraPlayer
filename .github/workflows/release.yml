name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      archive_name: ${{ steps.version.outputs.archive_name }}
      installer_name: ${{ steps.version.outputs.installer_name }}
      docker_archive_name: ${{ steps.version.outputs.docker_archive_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to Flutter version
        id: version
        run: python tools/release/validate_version.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  quality:
    name: Run release quality gates
    needs: validate
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  windows:
    name: Build Windows release
    needs: [validate, quality]
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.29.2
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: windows
        run: flutter pub get
      - name: Build and verify private ZIP
        shell: pwsh
        run: windows/tool/build_private_release.ps1 -OutputDirectory windows/dist
      - name: Set up Inno Setup 6.4.2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.2.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_2/innosetup-6.4.2.exe' `
            -OutFile $installer
          $expectedHash = '238e2cf82c212a3879a050e02d787283c54bcb72d5cb6070830942de56627d5b'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Inno Setup download SHA-256 mismatch.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'InnoSetup642'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          $compiler = Join-Path $installRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw "Missing $compiler" }
          "INNO_SETUP_PATH=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Windows installer
        shell: pwsh
        run: >-
          windows/tool/build_windows_installer.ps1
          -OutputDirectory windows/dist
          -SkipBuild
          -InnoSetupPath "$env:INNO_SETUP_PATH"
      - name: Verify release asset names
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
          INSTALLER_NAME: ${{ needs.validate.outputs.installer_name }}
        run: |
          foreach ($name in @($env:ARCHIVE_NAME, $env:INSTALLER_NAME)) {
            $asset = Join-Path 'windows/dist' $name
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing $asset" }
            if (-not (Test-Path -LiteralPath "$asset.sha256" -PathType Leaf)) { throw "Missing $asset.sha256" }
          }
      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            windows/dist/${{ needs.validate.outputs.archive_name }}
            windows/dist/${{ needs.validate.outputs.archive_name }}.sha256
            windows/dist/${{ needs.validate.outputs.installer_name }}
            windows/dist/${{ needs.validate.outputs.installer_name }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attest Windows release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            windows/dist/${{ needs.validate.outputs.archive_name }}
            windows/dist/${{ needs.validate.outputs.archive_name }}.sha256
            windows/dist/${{ needs.validate.outputs.installer_name }}
            windows/dist/${{ needs.validate.outputs.installer_name }}.sha256

  docker:
    name: Publish backend image
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: graysui
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/graysui/sakuraplayer-backend
            docker.io/graysui/sakuraplayer-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha
      - name: Build and push backend runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/docker/api.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Attest GHCR backend image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/graysui/sakuraplayer-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest Docker Hub backend image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: docker.io/graysui/sakuraplayer-backend
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deployment:
    name: Build Linux Docker deployment
    needs: [validate, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer syntax
        run: bash -n backend/install.sh backend/install-latest.sh
      - name: Build Linux Docker deployment assets
        run: >-
          python tools/release/build_docker_bundle.py
          --version "${{ needs.validate.outputs.semver }}"
          --output-dir backend/dist
      - name: Verify deployment asset names
        env:
          DOCKER_ARCHIVE_NAME: ${{ needs.validate.outputs.docker_archive_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.semver }}
        run: |
          case "$DOCKER_ARCHIVE_NAME" in
            SakuraPlayer-Docker-*.tar.gz) ;;
            *) echo "Invalid Docker deployment archive name" >&2; exit 1 ;;
          esac
          archive="backend/dist/$DOCKER_ARCHIVE_NAME"
          root="SakuraPlayer-Docker-$RELEASE_VERSION"
          test -f "$archive"
          test -f "$archive.sha256"
          actual="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$actual" "$expected"' EXIT
          tar -tzf "$archive" | LC_ALL=C sort > "$actual"
          printf '%s\n' \
            "$root/.env.example" \
            "$root/.release-version" \
            "$root/LICENSE" \
            "$root/README.md" \
            "$root/THIRD_PARTY_NOTICES.md" \
            "$root/docker-compose.yml" \
            "$root/install-latest.sh" \
            "$root/install.sh" | LC_ALL=C sort > "$expected"
          diff -u "$expected" "$actual"
          test "$(tar -xOzf "$archive" "$root/.release-version")" = "$RELEASE_VERSION"
          (cd backend/dist && sha256sum --check "$DOCKER_ARCHIVE_NAME.sha256")
      - name: Upload Linux Docker deployment assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-deployment
          path: |
            backend/dist/${{ needs.validate.outputs.docker_archive_name }}
            backend/dist/${{ needs.validate.outputs.docker_archive_name }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attest Linux Docker deployment assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            backend/dist/${{ needs.validate.outputs.docker_archive_name }}
            backend/dist/${{ needs.validate.outputs.docker_archive_name }}.sha256

  release:
    name: Create GitHub Release
    needs: [validate, quality, windows, deployment, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-assets
      - name: Download Linux Docker deployment assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-deployment
          path: release-assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: ${{ needs.validate.outputs.archive_name }}
          INSTALLER_NAME: ${{ needs.validate.outputs.installer_name }}
          DOCKER_ARCHIVE_NAME: ${{ needs.validate.outputs.docker_archive_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.semver }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/$ARCHIVE_NAME" \
            "release-assets/$ARCHIVE_NAME.sha256" \
            "release-assets/$INSTALLER_NAME" \
            "release-assets/$INSTALLER_NAME.sha256" \
            "release-assets/$DOCKER_ARCHIVE_NAME" \
            "release-assets/$DOCKER_ARCHIVE_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SakuraPlayer $RELEASE_VERSION" \
            --generate-notes

openapi: 3.1.0
info:
  title: SakuraPlayer API
  version: 1.2.0
  description: >-
    Private single-administrator API for the SakuraPlayer v1 backend. Video bytes
    are never proxied by this API; signed stream endpoints return 302 redirects.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalog
  - name: Discovery
  - name: Cloud115
  - name: Cache
  - name: Playback
  - name: Admin
  - name: Events
paths:
  /auth/bootstrap-status:
    get:
      tags: [Auth]
      operationId: getBootstrapStatus
      security: []
      responses:
        '200':
          description: Whether the unique administrator has been created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
  /auth/bootstrap:
    post:
      tags: [Auth]
      operationId: createAdministrator
      security: []
      parameters:
        - $ref: '#/components/parameters/BootstrapToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsInput'
      responses:
        '201':
          description: Unique administrator created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '409':
          $ref: '#/components/responses/AuthConflict'
        '422':
          $ref: '#/components/responses/AuthValidationError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsInput'
      responses:
        '200':
          description: Access and refresh tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '422':
          $ref: '#/components/responses/AuthValidationError'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Rotated access and refresh tokens.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '422':
          $ref: '#/components/responses/AuthValidationError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        '204':
          description: >-
            Current refresh session revoked. The caller must clear local access and
            refresh tokens plus private subtitle cache.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'

  /movies:
    get:
      tags: [Catalog]
      operationId: listMovies
      description: >-
        Returns only core-ready movies with at least one active AVdb source. All
        source-scoped filters must match the same source. Cursors are versioned
        and bound to the normalized filters, sort, and favorite flag.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: categories
          in: query
          description: Any selected category may match the same qualifying source.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/AvdbCategory'
          style: form
          explode: false
        - name: labels
          in: query
          description: Every selected label must exist on the same qualifying source.
          schema:
            type: array
            maxItems: 100
            items:
              $ref: '#/components/schemas/SourceLabel'
          style: form
          explode: false
        - name: source_website
          in: query
          schema:
            type: string
            enum: [sehuatang, x1080x]
        - name: playable
          in: query
          description: >-
            True requires availability=ready; false requires a non-ready source.
            The Phase 1 empty availability port reports active sources as available.
          schema:
            type: boolean
        - name: min_resource_size_mb
          in: query
          schema:
            type: integer
            minimum: 0
        - name: max_resource_size_mb
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sort
          in: query
          description: >-
            Publish-date sorts use MAX(publish_date) among qualifying sources,
            keep null last, and use movie_id as the stable tie-breaker.
          schema:
            type: string
            enum: [publish_date_desc, publish_date_asc, number_asc]
            default: publish_date_desc
        - name: favorite
          in: query
          description: >-
            When true, return the single movie favorite collection. False or
            omitted does not filter by favorite state.
          schema:
            type: boolean
      responses:
        '200':
          description: Only core-ready movies are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoviePage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /movies/{movie_id}:
    get:
      tags: [Catalog]
      operationId: getMovie
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Aggregated movie detail without magnet or upstream playback URLs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /movies/{movie_id}/favorite:
    put:
      tags: [Catalog]
      operationId: favoriteMovie
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '204':
          description: Movie favorited idempotently.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Catalog]
      operationId: unfavoriteMovie
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '204':
          description: Movie favorite removed idempotently.
        '404':
          $ref: '#/components/responses/NotFound'
  /catalog/images/{image_id}:
    get:
      tags: [Catalog]
      operationId: getCatalogImage
      description: >-
        Reads a permanent catalog image by database ID from the managed image root.
        Filesystem paths and upstream source URLs are never returned.
      parameters:
        - name: image_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Validated JPEG, PNG, or WebP bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /movies/{movie_id}/progress:
    put:
      tags: [Playback]
      operationId: updateMovieProgress
      parameters:
        - $ref: '#/components/parameters/MovieId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: Authoritative movie-level progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackProgress'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /movies/{movie_id}/play-requests:
    post:
      tags: [Cache]
      operationId: createPlayRequest
      description: >-
        The only operation that may create a 115 offline job. The source_id must
        belong to the movie and be an active AVdb source. A started disposition
        allows at most 60 seconds of client blocking; the backend job continues
        after that client wait expires. Replaying the same Idempotency-Key with
        the same movie/source returns the original job in any state; reusing the
        key for another payload returns idempotency_conflict.
      parameters:
        - $ref: '#/components/parameters/MovieId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id]
              properties:
                source_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Existing ready or active task reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayRequestResult'
        '202':
          description: New started or queued cache job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayRequestResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /search:
    get:
      tags: [Discovery]
      operationId: globalSearch
      description: >-
        Exact normalized movie numbers are evaluated first. A raw-only exact hit
        idempotently creates or promotes a metadata job to priority 10; running
        jobs are reused and failed jobs are reported without automatic retry.
        Pending items include the stable movie ID and may open a limited detail.
        The limit applies independently to each result group.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Grouped movie and actress results, plus metadata completion state.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '422':
          $ref: '#/components/responses/ValidationError'
  /rankings:
    get:
      tags: [Discovery]
      operationId: getRanking
      description: >-
        Reads one immutable local JavDB snapshot and never contacts JavDB during
        the request. Daily, weekly, and monthly reject year. TOP250 without year
        is the overall board; explicit years are 2008 through the server current
        year. Cursors bind the selected snapshot so a current switch cannot mix pages.
      parameters:
        - name: board
          in: query
          required: true
          schema:
            type: string
            enum: [daily, weekly, monthly, top250]
        - name: year
          in: query
          description: Only valid for top250; omitted top250 means the overall board.
          schema:
            type: integer
            minimum: 2008
            maximum: 2200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Latest successful local snapshot filtered to AVdb-backed core-ready movies.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPage'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: No successful snapshot exists for this board/year.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingUnavailableError'
  /actors:
    get:
      tags: [Catalog]
      operationId: listActors
      description: >-
        Returns actors related to at least one core-ready sourced movie. Search
        matches Japanese/Chinese names and authoritative aliases; ambiguous
        aliases return every matching actor.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: favorite
          in: query
          description: >-
            When true, return the single actor favorite collection. False or
            omitted does not filter by favorite state.
          schema:
            type: boolean
      responses:
        '200':
          description: Actress/actor page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorPage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /actors/{actor_id}:
    get:
      tags: [Catalog]
      operationId: getActor
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '200':
          description: >-
            Actor detail with deterministically ordered gallery URLs and related
            core-ready movies; each nested collection is limited to 100 items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /actors/{actor_id}/favorite:
    put:
      tags: [Catalog]
      operationId: favoriteActor
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '204':
          description: Actor favorited idempotently.
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Catalog]
      operationId: unfavoriteActor
      parameters:
        - $ref: '#/components/parameters/ActorId'
      responses:
        '204':
          description: Actor favorite removed idempotently.
        '404':
          $ref: '#/components/responses/NotFound'

  /cloud115/binding:
    get:
      tags: [Cloud115]
      operationId: getCloud115Binding
      responses:
        '200':
          description: Redacted binding status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cloud115Binding'
    delete:
      tags: [Cloud115]
      operationId: deleteCloud115Binding
      responses:
        '204':
          description: Binding removed when no active cache jobs exist.
        '409':
          $ref: '#/components/responses/Conflict'
  /cloud115/qr-sessions:
    post:
      tags: [Cloud115]
      operationId: createCloud115QrSession
      responses:
        '201':
          description: QR session and PNG payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrSession'
        '429':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Conflict'
  /cloud115/qr-sessions/{qr_session_id}:
    get:
      tags: [Cloud115]
      operationId: getCloud115QrSession
      parameters:
        - name: qr_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current QR state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrSession'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Conflict'
  /cloud115/qr-sessions/{qr_session_id}/confirm:
    post:
      tags: [Cloud115]
      operationId: confirmCloud115QrSession
      parameters:
        - name: qr_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Encrypted binding saved and SakuraPlayer-Cache ensured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cloud115Binding'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Conflict'

  /cache-jobs:
    get:
      tags: [Cache]
      operationId: listCacheJobs
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CacheJobStatus'
          style: form
          explode: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task snapshot and fixed capacity counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheJobPage'
  /cache-jobs/{cache_job_id}:
    get:
      tags: [Cache]
      operationId: getCacheJob
      parameters:
        - $ref: '#/components/parameters/CacheJobId'
      responses:
        '200':
          description: Full safe task snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /cache-jobs/{cache_job_id}/cancel:
    post:
      tags: [Cache]
      operationId: cancelCacheJob
      parameters:
        - $ref: '#/components/parameters/CacheJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  const: true
      responses:
        '202':
          description: Cancellation and safe cleanup accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheJob'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /cache-jobs/{cache_job_id}/cleanup:
    post:
      tags: [Cache]
      operationId: cleanupCacheJob
      description: >-
        Requests the same proof-based cleanup used by maintenance. Ready and
        awaiting-selection jobs enter cleaning; cleanup_failed retries create a
        new fenced attempt. Active playback leases reject the request.
      parameters:
        - $ref: '#/components/parameters/CacheJobId'
      responses:
        '202':
          description: Safe cleanup accepted when no active lease exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheJob'
        '409':
          $ref: '#/components/responses/Conflict'
  /cache-jobs/{cache_job_id}/media-selection:
    put:
      tags: [Cache]
      operationId: selectCacheMedia
      parameters:
        - $ref: '#/components/parameters/CacheJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_ids]
              properties:
                media_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Selected media or ordered segment queue saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheJob'
        '409':
          $ref: '#/components/responses/Conflict'

  /cache-jobs/{cache_job_id}/playback-sessions:
    post:
      tags: [Playback]
      operationId: createPlaybackSession
      parameters:
        - $ref: '#/components/parameters/CacheJobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_id, mode, platform, client_instance_id]
              properties:
                media_id:
                  type: string
                  format: uuid
                mode:
                  type: string
                  enum: [original, compatibility]
                platform:
                  type: string
                  enum: [windows, harmonyos]
                client_instance_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Twelve-hour signed playback capability and subtitle options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackManifest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /playback/streams/{playback_session_id}:
    get:
      tags: [Playback]
      operationId: redirectPlaybackStream
      description: >-
        Validates the signed owner/session epoch, resource ownership, fixed
        User-Agent, mode and expiry, then redirects to a short-lived 115/CDN URL.
        This endpoint never proxies video bytes.
      security: []
      parameters:
        - name: playback_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expires
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: signature
          in: query
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the original direct URL or selected highest-bandwidth HLS variant.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /playback/sessions/{playback_session_id}/subtitles/{subtitle_id}:
    get:
      tags: [Playback]
      operationId: downloadSubtitle
      description: >-
        Authenticated download for the application-private subtitle cache. The
        server revalidates the owner, session/cache/media relation and current
        managed remote tree before returning the original bytes.
      parameters:
        - name: playback_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subtitle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Subtitle bytes for client-private cache.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                pattern: '^attachment; filename="[0-9a-f-]{36}\.(srt|ass|ssa|vtt)"$'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              required: true
              schema:
                type: string
                const: nosniff
          content:
            application/x-subrip:
              schema:
                type: string
                format: binary
            text/vtt:
              schema:
                type: string
                format: binary
            text/x-ssa:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Subtitle exceeds the configured safe limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /playback/sessions/{playback_session_id}/heartbeat:
    put:
      tags: [Playback]
      operationId: heartbeatPlaybackSession
      parameters:
        - name: playback_session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackHeartbeat'
      responses:
        '200':
          description: Renewed lease and authoritative progress.
          content:
            application/json:
              schema:
                type: object
                required: [lease_expires_at, progress]
                properties:
                  lease_expires_at:
                    type: [string, 'null']
                    format: date-time
                  progress:
                    oneOf:
                      - $ref: '#/components/schemas/PlaybackProgress'
                      - type: 'null'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /events/snapshot:
    get:
      tags: [Events]
      operationId: getEventSnapshot
      responses:
        '200':
          description: Full task, credential and notification snapshot for reconnect recovery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSnapshot'

  /notifications/{notification_id}/read:
    put:
      tags: [Events]
      operationId: markNotificationRead
      description: Idempotently marks one notification read using the server clock.
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full notification with its authoritative read timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'

  /settings:
    get:
      tags: [Admin]
      operationId: getSettings
      responses:
        '200':
          description: Redacted settings and connection states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags: [Admin]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Redacted updated settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          $ref: '#/components/responses/ValidationError'
  /settings/connection-tests:
    post:
      tags: [Admin]
      operationId: testConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  enum: [cloud115, javdb, dmm, gfriends, ai]
              additionalProperties: false
      responses:
        '200':
          description: Redacted test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTest'
  /settings/mgdb-sync-requests:
    post:
      tags: [Admin]
      operationId: requestMgdbFullSync
      description: >-
        Enqueues one full MGDB reconciliation using the configured source. The
        same mode reuses an existing queued or claimed request. Terminal
        requests remain immutable and a new request uses the next free UTC
        minute slot.
      responses:
        '202':
          description: The full reconciliation request was created or reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MgdbSyncRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/metadata-queue:
    put:
      tags: [Admin]
      operationId: setMetadataQueueControl
      description: >-
        Pauses or resumes future metadata claims. Existing running attempts are
        not terminated, and resume never creates or retries metadata jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paused]
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Committed metadata claim control and current counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataQueueControl'
  /admin/metadata-jobs:
    get:
      tags: [Admin]
      operationId: listMetadataJobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, completed, completed_with_warnings, failed]
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Persistent metadata queue snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetadataJob'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/movies/{movie_id}/metadata-rescrape:
    post:
      tags: [Admin]
      operationId: rescrapeMovieMetadata
      description: >-
        Explicitly creates, promotes, or reuses the full metadata attempt for
        the server-owned movie number at manual priority. It never accepts a
        client-supplied number, provider, stage, or priority.
      parameters:
        - $ref: '#/components/parameters/MovieId'
      responses:
        '200':
          description: Full metadata attempt queued or already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataRescrape'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/metadata-jobs/{metadata_job_id}/retry:
    post:
      tags: [Admin]
      operationId: retryMetadataJob
      parameters:
        - name: metadata_job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: New queued attempt created; the failed row remains immutable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataJob'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/metadata-jobs/{metadata_job_id}/retry-enrichment:
    post:
      tags: [Admin]
      operationId: retryMetadataEnrichment
      description: >-
        Creates a new job that runs only explicitly selected failed or missing
        optional stages. It never reruns javdb_core and never retries automatically.
      parameters:
        - name: metadata_job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stages]
              properties:
                stages:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/MetadataEnrichmentStage'
      responses:
        '201':
          description: New queued enrichment-only attempt created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataJob'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/resources:
    get:
      tags: [Admin]
      operationId: listResourceSourcesForIdentification
      description: >-
        Lists resource-source identification records without magnet, upstream
        response bodies or other submission secrets. Results use stable
        imported_at/id keyset order; cursors are bound to status and query.
      parameters:
        - name: identification_status
          in: query
          schema:
            type: string
            enum: [pending, manual]
            default: pending
        - name: q
          in: query
          description: Literal case-insensitive title/raw-number search, or exact post ID.
          schema:
            type: string
            maxLength: 200
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Safe paginated identification queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingResourceSourcePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/resources/{source_id}/identification:
    put:
      tags: [Admin]
      operationId: identifyResourceSource
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [movie_id]
              properties:
                movie_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Pending source linked to a movie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieSource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/movies/merge:
    post:
      tags: [Admin]
      operationId: mergeMovies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_movie_id, source_movie_ids]
              properties:
                target_movie_id:
                  type: string
                  format: uuid
                source_movie_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Movies and their sources merged transactionally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/movies/{movie_id}/sources/{source_id}/split:
    post:
      tags: [Admin]
      operationId: splitMovieSource
      parameters:
        - $ref: '#/components/parameters/MovieId'
        - name: source_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_normalized_number]
              properties:
                new_normalized_number:
                  type: string
                  maxLength: 128
      responses:
        '201':
          description: Source moved to a new movie aggregate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovieDetail'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/diagnostics:
    get:
      tags: [Admin]
      operationId: getDiagnostics
      responses:
        '200':
          description: Redacted component, queue, credential and failure diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostics'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BootstrapToken:
      name: X-Bootstrap-Token
      in: header
      required: false
      description: >-
        Required only while no administrator exists. Once initialized, the server
        returns bootstrap_already_completed without reading or comparing this value.
      schema:
        type: string
        minLength: 43
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    Cursor:
      name: cursor
      in: query
      description: >-
        Opaque versioned keyset cursor bound to the endpoint's normalized query,
        filters and sort. Malformed or cross-query cursors return validation_failed.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 24
    MovieId:
      name: movie_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActorId:
      name: actor_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CacheJobId:
      name: cache_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]{16,128}$'
  headers:
    NoStore:
      description: Authentication state and credentials must never be cached.
      required: true
      schema:
        type: string
        const: no-store
  responses:
    AuthUnauthorized:
      description: Authentication, refresh or bootstrap credentials were rejected.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthConflict:
      description: Authentication state conflicts with the requested operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthValidationError:
      description: Authentication request cannot be validated.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing, invalid, expired or revoked authentication/capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but operation is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Requested resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: State, capacity, idempotency or ownership conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Request cannot be validated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UpstreamError:
      description: An external provider failed without exposing its response body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    BootstrapStatus:
      type: object
      required: [initialized, api_version]
      properties:
        initialized:
          type: boolean
        api_version:
          type: integer
          const: 1
    CredentialsInput:
      type: object
      required: [username, password, client_instance_id]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 12
          maxLength: 256
        client_instance_id:
          type: string
          format: uuid
          description: >-
            Stable UUID generated once per client installation and persisted in
            installation-scoped configuration. A successful login for the same
            administrator and client instance atomically revokes its previous active
            session; the last committed login remains active.
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          pattern: '^[a-z0-9_]+$'
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    AvdbCategory:
      type: string
      enum: [亚洲有码, 亚洲无码, 中文字幕, 4K原版, 素人有码, FC2]
    SourceLabel:
      type: string
      enum: [subtitle, cracked, 4k, censored]
    PlaybackProgress:
      type: object
      required: [position_seconds, duration_seconds, completed, version]
      properties:
        position_seconds:
          type: number
          minimum: 0
        duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        completed:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
          description: Authoritative server state version after the committed write.
    ProgressUpdate:
      type: object
      required: [position_seconds, duration_seconds, version]
      properties:
        position_seconds:
          type: number
          minimum: 0
        duration_seconds:
          type: [number, 'null']
          exclusiveMinimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
          description: Expected current server version; use 0 only when no state exists.
    MovieSummary:
      type: object
      required: [id, number, title, labels, favorite, source_count]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        title:
          type: string
        title_original:
          type: [string, 'null']
        cover_url:
          type: [string, 'null']
        publish_date:
          type: [string, 'null']
          format: date
        labels:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/SourceLabel'
        favorite:
          type: boolean
        source_count:
          type: integer
          minimum: 1
        progress:
          oneOf:
            - $ref: '#/components/schemas/PlaybackProgress'
            - type: 'null'
    MovieSource:
      type: object
      required:
        [id, website, external_post_id, title, category, labels, availability]
      properties:
        id:
          type: string
          format: uuid
        website:
          type: string
          enum: [sehuatang, x1080x]
        external_post_id:
          type: integer
          format: int64
        title:
          type: string
        publish_date:
          type: [string, 'null']
          format: date
        category:
          $ref: '#/components/schemas/AvdbCategory'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/SourceLabel'
        resource_size_mb:
          type: [integer, 'null']
          minimum: 0
        video_file_size_bytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [available, queued, running, ready, failed, rejected]
          description: Only ready is playable; Phase 1 defaults active sources to available.
    PendingResourceSource:
      type: object
      required:
        [id, website, external_post_id, title, section, identification_status]
      properties:
        id:
          type: string
          format: uuid
        website:
          type: string
        external_post_id:
          type: integer
          format: int64
        title:
          type: string
        raw_number:
          type: [string, 'null']
        publish_date:
          type: [string, 'null']
          format: date
        section:
          $ref: '#/components/schemas/AvdbCategory'
        category:
          type: [string, 'null']
        resource_size_mb:
          type: [integer, 'null']
          minimum: 0
        identification_status:
          type: string
          enum: [pending, manual]
    PendingResourceSourcePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PendingResourceSource'
        next_cursor:
          type: [string, 'null']
    ActorSummary:
      type: object
      required: [id, display_name, aliases, favorite]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        name_ja:
          type: [string, 'null']
        name_zh:
          type: [string, 'null']
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
        profile_url:
          type: [string, 'null']
        favorite:
          type: boolean
    MovieDetail:
      allOf:
        - $ref: '#/components/schemas/MovieSummary'
        - type: object
          required: [metadata_state, metadata_error_code, actors, tags, plot_image_urls, sources]
          properties:
            metadata_state:
              type: string
              enum: [core_ready, queued, running, failed]
              description: Non-core states identify a limited pending detail.
            metadata_error_code:
              type: [string, 'null']
              description: Stable redacted code; only populated for failed limited details.
            release_date:
              type: [string, 'null']
              format: date
            maker:
              type: [string, 'null']
            series:
              type: [string, 'null']
            director:
              type: [string, 'null']
            score:
              type: [number, 'null']
            description:
              type: [string, 'null']
              description: Completed Chinese translation only; null without one.
            description_original:
              type: [string, 'null']
              description: Compatibility source text; clients must not render it as the main description.
            actors:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ActorSummary'
            tags:
              type: array
              maxItems: 100
              items:
                type: string
            plot_image_urls:
              type: array
              maxItems: 100
              items:
                type: string
                format: uri-reference
            sources:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/MovieSource'
    MoviePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MovieSummary'
        next_cursor:
          type: [string, 'null']
    ActorDetail:
      allOf:
        - $ref: '#/components/schemas/ActorSummary'
        - type: object
          required: [gallery_urls, movies]
          properties:
            bio:
              type: [string, 'null']
            bio_original:
              type: [string, 'null']
            gallery_urls:
              type: array
              maxItems: 100
              items:
                type: string
                format: uri
            movies:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/MovieSummary'
    ActorPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActorSummary'
        next_cursor:
          type: [string, 'null']
    SearchResult:
      type: object
      required: [movies, actors, pending_metadata]
      properties:
        movies:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MovieSummary'
        actors:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ActorSummary'
        pending_metadata:
          type: array
          maxItems: 100
          items:
            type: object
            required: [movie_id, number, state, metadata_job_id]
            properties:
              movie_id:
                type: string
                format: uuid
              number:
                type: string
              state:
                type: string
                enum: [queued, running, failed]
              metadata_job_id:
                type: string
                format: uuid
    RankingItem:
      type: object
      required: [rank, movie]
      properties:
        rank:
          type: integer
          minimum: 1
        movie:
          $ref: '#/components/schemas/MovieSummary'
    RankingPage:
      type: object
      required: [board, year, available_years, synced_at, items, next_cursor]
      properties:
        board:
          type: string
          enum: [daily, weekly, monthly, top250]
        year:
          type: [integer, 'null']
        available_years:
          description: Descending 2008..current year for top250; empty otherwise.
          type: array
          maxItems: 100
          items:
            type: integer
            minimum: 2008
        synced_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankingItem'
        next_cursor:
          type: [string, 'null']
    RankingUnavailableDetails:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
            [credentials_not_configured, credentials_invalid, never_synced, sync_failed]
        last_error_code:
          type: [string, 'null']
          pattern: '^[a-z0-9_]+$'
    RankingUnavailableError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [details]
          properties:
            details:
              $ref: '#/components/schemas/RankingUnavailableDetails'
    Cloud115Binding:
      type: object
      required: [bound, status, cache_root_ready]
      properties:
        bound:
          type: boolean
        status:
          type: string
          enum: [unbound, active, expired, unavailable, detached]
        display_name:
          type: [string, 'null']
        cache_root_ready:
          type: boolean
        last_verified_at:
          type: [string, 'null']
          format: date-time
    QrSession:
      type: object
      required: [id, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [waiting, scanned, confirmed, expired, canceled]
        qrcode_png_base64:
          type: [string, 'null']
        expires_at:
          type: string
          format: date-time
    CacheJobStatus:
      type: string
      enum:
        - queued
        - submitting
        - offlining
        - submit_uncertain
        - resolving
        - awaiting_selection
        - ready
        - cancelling
        - cleaning
        - cleanup_failed
        - failed
        - cleaned
        - detached
    RemoteMedia:
      type: object
      required: [id, candidate_id, name, size_bytes, sequence_no, is_valid]
      properties:
        id:
          type: string
          format: uuid
        candidate_id:
          type: string
          format: uuid
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: [integer, 'null']
          format: int64
        sequence_no:
          type: integer
        is_valid:
          type: boolean
    SubtitleOption:
      type: object
      required: [id, media_id, name, format, selected_by_default]
      properties:
        id:
          type: string
          format: uuid
        media_id:
          type: [string, 'null']
          format: uuid
          description: Null means the subtitle is available to every media session in this manifest.
        name:
          type: string
        format:
          type: string
          enum: [srt, ass, ssa, vtt]
        language:
          type: [string, 'null']
        selected_by_default:
          type: boolean
    CacheJob:
      type: object
      required:
        [id, movie_id, source_id, status, remote_percent, media_candidates, selected_media_ids, subtitles, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        movie_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CacheJobStatus'
        remote_percent:
          type: number
          minimum: 0
          maximum: 100
        error_code:
          type: [string, 'null']
        media_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RemoteMedia'
        selected_media_ids:
          type: array
          items:
            type: string
            format: uuid
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleOption'
        ready_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CacheCapacity:
      type: object
      required: [running, running_limit, queued, queued_limit, ready, ready_limit]
      properties:
        running:
          type: integer
        running_limit:
          type: integer
          const: 2
        queued:
          type: integer
        queued_limit:
          type: integer
          const: 10
        ready:
          type: integer
        ready_limit:
          type: integer
          default: 20
    CacheJobPage:
      type: object
      required: [items, capacity]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CacheJob'
        capacity:
          $ref: '#/components/schemas/CacheCapacity'
        next_cursor:
          type: [string, 'null']
    PlayRequestResult:
      type: object
      required: [disposition, cache_job]
      properties:
        disposition:
          type: string
          enum: [ready, started, queued, reused]
        wait_deadline:
          type: [string, 'null']
          format: date-time
          description: Present only for a newly created started disposition; exactly 60 seconds from the server response clock and never persisted.
        cache_job:
          $ref: '#/components/schemas/CacheJob'
    PlaybackManifest:
      type: object
      required:
        [session_id, cache_job_id, mode, platform, stream_url, expires_at, subtitle_cache_expires_at, required_user_agent, embedded_tracks_source, media_queue, subtitles, progress]
      properties:
        session_id:
          type: string
          format: uuid
        cache_job_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [original, compatibility]
        platform:
          type: string
          enum: [windows, harmonyos]
        stream_url:
          type: string
          format: uri-reference
        expires_at:
          type: string
          format: date-time
        subtitle_cache_expires_at:
          type: string
          format: date-time
          description: Client-private subtitle copies must be removed no later than this instant.
        required_user_agent:
          type: string
        embedded_tracks_source:
          type: string
          const: client_player
          description: Embedded subtitle and audio tracks are enumerated by the application player.
        media_queue:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PlaybackQueueItem'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleOption'
        progress:
          oneOf:
            - $ref: '#/components/schemas/PlaybackProgress'
            - type: 'null'
          description: Authoritative movie progress; completed states have position_seconds 0.
    PlaybackQueueItem:
      type: object
      required: [session_id, media, stream_url]
      properties:
        session_id:
          type: string
          format: uuid
        media:
          $ref: '#/components/schemas/RemoteMedia'
        stream_url:
          type: string
          format: uri-reference
    PlaybackHeartbeat:
      type: object
      required: [client_instance_id]
      properties:
        client_instance_id:
          type: string
          format: uuid
        progress:
          $ref: '#/components/schemas/ProgressUpdate'
        playing:
          type: boolean
          default: true
          description: False atomically flushes optional progress and ends the lease without refreshing cache TTL.
    MetadataEnrichmentStage:
      type: string
      enum: [images, dmm, actor_map, gfriends, translation]
    MetadataStage:
      type: object
      required: [stage, status, error_code]
      properties:
        stage:
          type: string
          enum: [javdb_core, images, dmm, actor_map, gfriends, translation]
        status:
          type: string
          enum: [pending, running, succeeded, warning, failed, skipped]
        error_code:
          type: [string, 'null']
    MetadataJob:
      type: object
      required:
        [id, number, priority, reason, retry_mode, requested_stages, status, attempt_no, stages, retryable_stages, created_at]
      properties:
        id:
          type: string
          format: uuid
        movie_id:
          type: [string, 'null']
          format: uuid
        number:
          type: string
        priority:
          type: integer
        reason:
          type: string
          enum: [manual_or_search, ranking, daily, initial, history]
        retry_mode:
          type: string
          enum: [full, missing_enrichment]
        requested_stages:
          type: array
          items:
            $ref: '#/components/schemas/MetadataEnrichmentStage'
        parent_job_id:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, completed_with_warnings, failed]
        stage:
          type: [string, 'null']
        attempt_no:
          type: integer
          minimum: 1
        elapsed_ms:
          type: [integer, 'null']
          format: int64
        error_code:
          type: [string, 'null']
        stages:
          type: array
          items:
            $ref: '#/components/schemas/MetadataStage'
        retryable_stages:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MetadataEnrichmentStage'
        created_at:
          type: string
          format: date-time
    MetadataRescrape:
      type: object
      additionalProperties: false
      required: [job_id, state, created]
      properties:
        job_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running]
        created:
          type: boolean
    ProviderState:
      type: object
      required: [configured, status]
      properties:
        configured:
          type: boolean
        status:
          type: string
          enum: [unknown, available, unavailable, credentials_invalid, not_configured]
        last_checked_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
    JavdbSettings:
      allOf:
        - $ref: '#/components/schemas/ProviderState'
        - type: object
          required: [password_configured, version]
          properties:
            username:
              type: [string, 'null']
            password_configured:
              type: boolean
            version:
              type: integer
              minimum: 0
    AiSettings:
      allOf:
        - $ref: '#/components/schemas/ProviderState'
        - type: object
          required: [api_key_configured, version]
          properties:
            base_url:
              type: [string, 'null']
              format: uri
            model:
              type: [string, 'null']
            timeout_seconds:
              type: [integer, 'null']
              minimum: 1
              maximum: 600
            api_key_configured:
              type: boolean
            version:
              type: integer
              minimum: 0
    SyncRunState:
      type: object
      required: [status, imported_count]
      properties:
        status:
          type: string
          enum: [never, running, succeeded, failed]
        imported_count:
          type: integer
          minimum: 0
        release_id:
          type: [string, 'null']
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        last_successful_at:
          type: [string, 'null']
          format: date-time
        next_scheduled_at:
          type: [string, 'null']
          format: date-time
        last_error_code:
          type: [string, 'null']
    AvdbSyncStatus:
      type: object
      required: [incremental_30d, full_reconcile]
      properties:
        incremental_30d:
          $ref: '#/components/schemas/SyncRunState'
        full_reconcile:
          $ref: '#/components/schemas/SyncRunState'
    Settings:
      type: object
      required:
        [cache_ttl_hours, ready_cache_limit, metadata_concurrency, metadata_timeout_seconds, javdb, ai, mgdb, providers, avdb_sync]
      properties:
        cache_ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
          default: 24
        ready_cache_limit:
          type: integer
          default: 20
        metadata_concurrency:
          type: integer
          const: 3
        metadata_timeout_seconds:
          type: integer
          const: 600
        javdb:
          $ref: '#/components/schemas/JavdbSettings'
        ai:
          $ref: '#/components/schemas/AiSettings'
        mgdb:
          $ref: '#/components/schemas/MgdbSettings'
        providers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ProviderState'
        avdb_sync:
          $ref: '#/components/schemas/AvdbSyncStatus'
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        cache_ttl_hours:
          type: integer
          minimum: 1
          maximum: 168
        javdb:
          $ref: '#/components/schemas/JavdbSettingsCommand'
        ai:
          $ref: '#/components/schemas/AiSettingsCommand'
        mgdb:
          $ref: '#/components/schemas/MgdbSettingsCommand'
      additionalProperties: false
    SettingClearCommand:
      type: object
      required: [action, expected_version]
      properties:
        action:
          const: clear
        expected_version:
          type: integer
          minimum: 1
      additionalProperties: false
    JavdbSettingsReplace:
      type: object
      required: [action, expected_version, username, password]
      properties:
        action:
          const: replace
        expected_version:
          type: integer
          minimum: 0
        username:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 1024
      additionalProperties: false
    JavdbSettingsCommand:
      oneOf:
        - $ref: '#/components/schemas/JavdbSettingsReplace'
        - $ref: '#/components/schemas/SettingClearCommand'
    AiSettingsReplace:
      type: object
      required: [action, expected_version, base_url, api_key, model, timeout_seconds]
      properties:
        action:
          const: replace
        expected_version:
          type: integer
          minimum: 0
        base_url:
          type: string
          format: uri
          maxLength: 2048
        api_key:
          type: string
          minLength: 1
          maxLength: 8192
        model:
          type: string
          minLength: 1
          maxLength: 255
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 600
      additionalProperties: false
    AiSettingsCommand:
      oneOf:
        - $ref: '#/components/schemas/AiSettingsReplace'
        - $ref: '#/components/schemas/SettingClearCommand'
    MgdbSettings:
      type: object
      required: [configured, source_url, version]
      properties:
        configured:
          type: boolean
        source_url:
          type: [string, 'null']
          format: uri
          maxLength: 512
        version:
          type: integer
          minimum: 0
    MgdbSettingsReplace:
      type: object
      required: [action, expected_version, source_url]
      properties:
        action:
          const: replace
        expected_version:
          type: integer
          minimum: 0
        source_url:
          type: string
          format: uri
          minLength: 1
          maxLength: 512
      additionalProperties: false
    MgdbSettingsCommand:
      oneOf:
        - $ref: '#/components/schemas/MgdbSettingsReplace'
        - $ref: '#/components/schemas/SettingClearCommand'
    MgdbSyncRequest:
      type: object
      required: [request_id, mode, created]
      properties:
        request_id:
          type: string
          format: uuid
        mode:
          type: string
          const: full_reconcile
        created:
          type: boolean
      additionalProperties: false
    ConnectionTest:
      type: object
      required: [target, status, error_code, elapsed_ms, checked_at]
      properties:
        target:
          type: string
          enum: [cloud115, javdb, dmm, gfriends, ai]
        status:
          type: string
          enum: [available, unavailable, credentials_invalid, not_configured]
        error_code:
          type: [string, 'null']
        elapsed_ms:
          type: integer
        checked_at:
          type: string
          format: date-time
    ComponentDiagnostic:
      type: object
      required: [component, status, checked_at]
      properties:
        component:
          type: string
          enum: [api, scheduler, worker, postgres, avdb, javdb, dmm, gfriends, ai, cloud115]
        status:
          type: string
          enum: [healthy, degraded, unavailable, credentials_invalid, unknown]
        error_code:
          type: [string, 'null']
        checked_at:
          type: string
          format: date-time
    QueueDiagnostic:
      type: object
      required: [metadata_queued, metadata_running, metadata_paused, cache_queued, cache_running, cache_ready]
      properties:
        metadata_queued:
          type: integer
          minimum: 0
        metadata_running:
          type: integer
          minimum: 0
          maximum: 3
        metadata_paused:
          type: boolean
        cache_queued:
          type: integer
          minimum: 0
          maximum: 10
        cache_running:
          type: integer
          minimum: 0
          maximum: 2
        cache_ready:
          type: integer
          minimum: 0
    MetadataQueueControl:
      type: object
      required: [paused, queued, running]
      properties:
        paused:
          type: boolean
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
          maximum: 3
    FailureDiagnostic:
      type: object
      required: [task_type, task_id, error_code, attempt_no, occurred_at]
      properties:
        task_type:
          type: string
          enum: [metadata, cache, sync, credential]
        task_id:
          type: string
          format: uuid
        stage:
          type: [string, 'null']
        error_code:
          type: string
        elapsed_ms:
          type: [integer, 'null']
          format: int64
        attempt_no:
          type: integer
          minimum: 1
        occurred_at:
          type: string
          format: date-time
    MetadataProgress:
      type: object
      required: [total, queued, running, completed, failed, finished, current_numbers]
      properties:
        total:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
          maximum: 3
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        finished:
          type: integer
          minimum: 0
        current_numbers:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
    Diagnostics:
      type: object
      required: [generated_at, components, queues, metadata_progress, recent_failures, connection_tests]
      properties:
        generated_at:
          type: string
          format: date-time
        components:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ComponentDiagnostic'
        queues:
          $ref: '#/components/schemas/QueueDiagnostic'
        metadata_progress:
          $ref: '#/components/schemas/MetadataProgress'
        recent_failures:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FailureDiagnostic'
        connection_tests:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ConnectionTest'
    Notification:
      type: object
      required: [id, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [cache_started, cache_ready, cache_failed, credential_expired]
        resource_id:
          type: [string, 'null']
          format: uuid
        error_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
    EventSnapshot:
      type: object
      required: [snapshot_version, last_event_id, queues, cache_jobs, metadata_jobs, cloud115_binding, notifications]
      properties:
        snapshot_version:
          type: integer
          format: int64
          minimum: 0
        last_event_id:
          type: [string, 'null']
          format: uuid
        cache_jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CacheJob'
        metadata_jobs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MetadataJob'
        cloud115_binding:
          $ref: '#/components/schemas/Cloud115Binding'
        queues:
          $ref: '#/components/schemas/QueueDiagnostic'
        notifications:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Notification'

name: sakuraplayer_windows
description: SakuraPlayer private Windows desktop client.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <3.8.0"
  flutter: ">=3.29.2 <3.30.0"

dependencies:
  dio: 5.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 19.5.0
  flutter_riverpod: 3.1.0
  flutter_secure_storage: 9.2.0
  flutter_secure_storage_windows: 3.1.2
  go_router: 16.3.0
  media_kit: 1.1.11
  media_kit_libs_video: 1.0.5
  media_kit_video: 1.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
